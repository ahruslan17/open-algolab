<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./visualizer/" />
    <title>OpenAlgoLab</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        color: #101828;
        background: linear-gradient(135deg, #f8fbff, #eef3ff);
      }

      main {
        width: min(520px, calc(100vw - 40px));
        padding: 32px;
        border: 1px solid #d8e2f3;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 24px 80px rgba(34, 53, 108, 0.16);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 8vw, 4rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 0 0 24px;
        color: #667085;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        border-radius: 999px;
        padding: 12px 18px;
        color: #ffffff;
        background: #2457ff;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenAlgoLab</h1>
      <p>Redirecting to the visual algorithm lab.</p>
      <a href="./visualizer/">Open Visualizer</a>
    </main>
  </body>
</html>
