<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAlgoLab Visualizer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Course navigation">
        <a class="brand" href="./" aria-label="OpenAlgoLab home">
          <span class="brand-mark">O</span>
          <span>
            <strong>OpenAlgoLab</strong>
            <small id="brand-subtitle"></small>
          </span>
        </a>

        <div class="language-switcher" aria-label="Language switcher">
          <button class="language-trigger" id="language-trigger" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="language-trigger-flag" aria-hidden="true"></span>
            <span class="sr-only" id="language-trigger-label"></span>
          </button>
          <div class="language-menu" id="language-menu" hidden></div>
        </div>

        <nav class="course-nav" aria-label="Algorithms">
          <p class="nav-label" id="nav-label"></p>
          <div id="nav-items"></div>
        </nav>

        <div class="sidebar-note">
          <strong id="sidebar-note-title"></strong>
          <p id="sidebar-note-text"></p>
        </div>
      </aside>

      <main class="main-content">
        <section class="lesson-hero">
          <p class="eyebrow" id="lesson-eyebrow"></p>
          <h1 id="title"></h1>
          <p class="hero-copy" id="hero-copy"></p>
        </section>

        <section class="lesson-layout">
          <article class="lesson-card" aria-label="Algorithm explanation">
            <div class="section-kicker" id="lesson-kicker"></div>
            <div id="lesson-sections"></div>
          </article>

          <section class="lab-card" id="lab-card" aria-label="Interactive trace visualizer">
            <div class="lab-header">
              <div>
                <p class="eyebrow" id="lab-eyebrow"></p>
                <h2 id="trace-title"></h2>
                <p id="pattern" class="pattern"></p>
              </div>
              <div class="step-pill" id="step-counter"></div>
            </div>

            <div class="progress-track" id="progress-track" aria-label="Trace progress"></div>

            <div class="visual-stage">
              <div id="array" class="array" aria-label="Array visualization"></div>
              <div class="window-summary">
                <div>
                  <span id="current-window-label"></span>
                  <strong id="window-values"></strong>
                </div>
                <div>
                  <span id="best-answer-label"></span>
                  <strong id="best-answer"></strong>
                </div>
              </div>
            </div>

            <div class="state-grid" id="state"></div>

            <article class="trace-explanation">
              <div>
                <p class="label" id="action-label"></p>
                <p id="action"></p>
              </div>
              <div>
                <p class="label" id="decision-label"></p>
                <p id="decision"></p>
              </div>
              <div>
                <p class="label" id="why-label"></p>
                <p id="why"></p>
              </div>
            </article>

            <div class="controls" aria-label="Trace controls">
              <button id="prev" type="button"></button>
              <button id="next" type="button"></button>
              <button id="reset" type="button"></button>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="./locales/en.js"></script>
    <script src="./locales/ru.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
